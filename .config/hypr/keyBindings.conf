###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

# ESSENTIALS
bind = $mainMod, return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, ESCAPE, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $terminal --title yazi $fileManager
bind = $mainMod, ESCAPE, exec, hyprlock

# WINDOW MANAGEMENT
# Move window focus
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
# Move windows with keys
bind = $mainMod SHIFT, H, movewindow, l # Move window left
bind = $mainMod SHIFT, L, movewindow, r # Move window right
bind = $mainMod SHIFT, K, movewindow, u # Move window up
bind = $mainMod SHIFT, J, movewindow, d # Move window down
# Resize windows with keys
binde = SUPER, left, resizeactive, -35 0
binde = SUPER, right, resizeactive, 35 0
binde = SUPER, up, resizeactive, 0 35
binde = SUPER, down, resizeactive, 0 -35
# Fullscreen
bind = $mainMod, F, fullscreen, 1 # Expand to full screen
bind = $mainMod SHIFT, F, fullscreen, 2 # Fill entire screen
bind = $mainMod, D, layoutmsg, togglesplit # Split windows
# Move/resize windows with mouse/touchpad
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, + -, resizewindow
# Float window management
bind = $mainMod, V, togglefloating # Individual window float
bind = $mainMod SHIFT, V, workspaceopt, allfloat # Float all windows in active workspace
bind = $mainMod, C, centerwindow # Center float window

# NOTIFICATION CENTER
bind = $mainMod, N, exec, swaync-client -t -sw

# ROFI
bind = $mainMod, SPACE, exec, $searchWindows # Search windows
bind = $mainMod, M, exec, $openControlCenter
#bind = $mainMod, SPACE, exec, $searchApps

# SHOW/HIDE WAYBAR
bind = $mainMod, W, exec, killall -SIGUSR1 waybar

# WALLPAPER/THEME CHANGE
bind = $mainMod SHIFT, W, exec, $selectWallpaper

# BROWSER SHORTCUTS
bind = $mainMod, I, exec, $browser
bind = $mainMod SHIFT, Y, exec, $browser https://youtube.com # YouTube shortcut
bind = $mainMod SHIFT, U, exec, $browser https://mail.google.com/mail # Gmail shortcut
bind = $mainMod SHIFT, T, exec, $browser https://calendar.google.com/calendar/u/0/r # Google Calendar shortcut
bind = $mainMod SHIFT, O, exec, $browser https://github.com/ # GitHub shortcut
bind = $mainMod SHIFT, I, exec, $browser https://claude.ai/new # Claude shortcut

# IDE
bind = $mainMod, O, exec, $IDE

# ENTERTAINMENT
bind = $mainMod, P, exec, $music
bind = $mainMod SHIFT, G, exec, $steam

# WORKSPACE MANAGEMENT
# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
# Move active window to a workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# VOLUME, BRIGHTNESS, AND AUDIO
# Volume keys
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# Brightness keys
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
# Audio
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
